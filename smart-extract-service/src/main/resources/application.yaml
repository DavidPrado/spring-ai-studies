spring:
  application:
    name: erp-ai-core
  profiles:
    active: dev

  main:
    lazy-initialization: true
    banner-mode: off

  jmx:
    enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    schemas: public
    create-schemas: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128
        generate_statistics: true

  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 300000
      pool-name: SmartExtractPool
      data-source-properties:
        reWriteBatchedInserts: true
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  data:
    redis:
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.3
          num-ctx: 4096

        embedding:
          options:
            model: nomic-embed-text

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

app:
  jwt:
    expiration: 86400000
    secret: "base-secret-key"
    issuer: "smart-erp-ia"
  bulk:
    max-sync-rows: 1000
    max-streaming-rows: 10000
    worker:
      pool-size: 3
      batch-size: 50
      rate-limit-ms: 100
      poll-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    root: INFO
    com.smart_extract_service: INFO